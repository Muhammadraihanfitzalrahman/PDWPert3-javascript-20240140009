<!DOCTYPE html>
<html>
<head>
<title>Praktikum JavaScript</title>

<style>
body{
    font-family: Arial;
    background: linear-gradient(to right,#4facfe,#00f2fe);
    text-align:center;
    margin-top:100px;
}

.container{
    background:white;
    padding:30px;
    width:400px;
    margin:auto;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

h2{
    color:#333;
}

button{
    padding:10px 20px;
    margin:10px;
    border:none;
    border-radius:5px;
    background:#4facfe;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0077ff;
}

#tanggal{
    font-weight:bold;
    margin-top:15px;
    color:#444;
}
</style>

</head>

<body>

<div class="container">

<h2>Praktikum JavaScript</h2>

<script>
alert("Ini sebuah alert");
</script>

<p id="tanggal">Tanggal belum ditampilkan</p>

<button onclick="date()">Tampilkan Tanggal</button>
<br>

<button onclick="tampil()">Klik Button</button>

<button onclick="show()">Perkenalan</button>

</div>

<script src="script.js"></script>

</body>
</html>
